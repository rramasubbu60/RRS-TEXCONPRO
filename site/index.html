<!doctype html>
<html lang="en">
<head>
<style>html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}</style>
<title>RRS TEXCONPRO</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="RRS TEXCONPRO – textile consultancy records, billing and reports">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: one-column phone app — sticky title bar, scrolling content, fixed bottom tab bar; widens to a centred 720px column on desktop */
:root{
  --bg:#eeeff0; --surface:#ffffff; --sunk:#e4e6e8; --line:#cfd3d6;
  --ink:#1e2225; --muted:#5d656b; --accent:#0d7a78; --accent-ink:#ffffff; --accent-soft:#d5edec;
  --bar:#3b4045; --bar-ink:#ffffff;
  --good:#1d6b45; --good-soft:#dcefe4; --warn:#8a5a00; --warn-soft:#f6ebcf; --bad:#a3302a; --bad-soft:#f5dcda;
  --f-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --fs:17px; --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151718; --surface:#1f2224; --sunk:#111314; --line:#343a3e;
  --ink:#e6e8e9; --muted:#9ba2a7; --accent:#48b9b5; --accent-ink:#06191a; --accent-soft:#163433;
  --bar:#2a2e31; --bar-ink:#f1f3f4;
  --good:#6cc596; --good-soft:#173528; --warn:#e3b55a; --warn-soft:#3a2e14; --bad:#ef8a83; --bad-soft:#3d1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151718; --surface:#1f2224; --sunk:#111314; --line:#343a3e;
  --ink:#e6e8e9; --muted:#9ba2a7; --accent:#48b9b5; --accent-ink:#06191a; --accent-soft:#163433;
  --bar:#2a2e31; --bar-ink:#f1f3f4;
  --good:#6cc596; --good-soft:#173528; --warn:#e3b55a; --warn-soft:#3a2e14; --bad:#ef8a83; --bad-soft:#3d1f1d; color-scheme:dark}
:root.big{--fs:19.5px}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--accent)}
.top-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:58px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--f-display);font-weight:700;font-size:1.15em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.top .back{background:transparent;border:1.5px solid currentColor;color:inherit;border-radius:8px;padding:6px 12px;min-height:40px;font-weight:600;cursor:pointer}
.sync{font-size:.72em;font-family:var(--f-mono);opacity:.85;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
nav.tabs button{background:none;border:0;min-height:62px;font-size:.66em;padding:0 2px;min-width:0;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-top:3px solid transparent}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent);border-top-color:var(--accent)}
h2{font-family:var(--f-display);font-weight:700;font-size:1.05em;margin:0;letter-spacing:.01em;text-wrap:balance}
.eyebrow{font-size:.72em;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.85em}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hero-btn{min-height:68px;font-size:1.1em;font-family:var(--f-display);font-weight:700;letter-spacing:.01em}
.today{display:flex;flex-direction:column;gap:2px}
.today .d{font-family:var(--f-display);font-size:1.6em;font-weight:800;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-mono);font-size:1.15em;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:.8em;color:var(--muted)}
@media (min-width:600px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;min-height:64px}
.item:last-child{border-bottom:0}
.item:hover{background:var(--sunk)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:.85em;color:var(--muted);overflow-wrap:anywhere}
.item .r{text-align:right;white-space:nowrap}
.pill{display:inline-block;font-size:.72em;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap;letter-spacing:.02em}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
form{display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-weight:600;font-size:.9em}
.f .hint{font-size:.8em;color:var(--muted)}
input,select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px}
textarea{min-height:92px;resize:vertical}
input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two.stack{grid-template-columns:1fr}}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:12px;margin:0;min-width:0}
legend{font-family:var(--f-display);font-weight:700;padding:0 6px}
.search{position:relative}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;min-height:40px;font-weight:600;font-size:.88em;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.check.on{border-color:var(--accent);background:var(--accent-soft)}
.totals{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-variant-numeric:tabular-nums}
.totals .v{font-family:var(--f-mono);text-align:right}
.totals .grand{font-weight:700;font-size:1.1em;border-top:2px solid var(--ink);padding-top:6px}
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:6px 12px;font-size:.92em}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.note{padding:12px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.88em}
.note.info{background:var(--accent-soft);color:var(--accent)}
.prewrap{white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:9px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.confirm{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.confirm .box{background:var(--surface);border-radius:12px;padding:20px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px}
.cap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:600px){.cap{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cap button{min-height:64px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left;font-size:.92em}
.cap button .ic{flex:none;width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:.78em;font-weight:500}
.mtabs{display:flex;gap:6px;overflow-x:auto;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px)) 6px}
.mtabs .chip{flex:none}
.chip .c{font-family:var(--f-mono);font-weight:400;opacity:.75;margin-left:4px}
.ptable{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:6px;align-items:center;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.prow .pn{grid-column:1/-1}
.prow input{min-height:44px;padding:8px 10px}
.prow .x{min-height:44px;width:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:1.2em;color:var(--bad)}
@media (min-width:600px){.prow{grid-template-columns:2fr .9fr 1fr 1fr auto}.prow .pn{grid-column:auto}}
.phead{display:none;font-size:.75em;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
@media (min-width:600px){.phead{display:grid;grid-template-columns:2fr .9fr 1fr 1fr 44px;gap:6px}}
.dtable{width:100%;border-collapse:collapse;font-size:.92em}
.dtable th{text-align:left;font-size:.72em;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1.5px solid var(--line)}
.dtable td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.dtable .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.dtable a,.linkbtn{color:var(--accent);background:none;border:0;padding:0;font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.scroll{overflow-x:auto}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:600px){.pgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pgrid .ph{border:0;padding:0;background:var(--sunk);border-radius:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;position:relative}
.pgrid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pgrid .ph span{font-size:.72em;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.pgrid .tag{position:absolute;top:4px;left:4px;font-size:.66em;font-weight:700;background:var(--ink);color:var(--bg);padding:1px 6px;border-radius:4px;letter-spacing:.04em}
.full{width:100%;border-radius:8px;background:var(--sunk);display:block}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vis{font-size:.7em}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dow{font-size:.68em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal .day{min-height:62px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;cursor:pointer;min-width:0;overflow:hidden}
.cal .day .dn{font-family:var(--f-mono);font-size:.75em;color:var(--muted)}
.cal .day.today .dn{color:var(--accent);font-weight:700}
.cal .day.today{border-color:var(--accent)}
.cal .day.sel{outline:2.5px solid var(--accent);outline-offset:-1px;background:var(--accent-soft)}
.cal .ev{font-size:.6em;line-height:1.25;padding:1px 3px;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cal .ev.done{background:var(--accent);color:var(--accent-ink)}
.cal .ev.plan{border:1.5px dashed var(--accent);color:var(--accent);padding:0 2px}
.cal .ev.more{color:var(--muted)}
.cal .dots{display:flex;gap:2px;margin-top:auto}
.cal .dots i,.legend .lg{display:inline-block;width:7px;height:7px;border-radius:50%}
.cal .dots i.follow,.legend .lg.follow{background:var(--warn)}
.cal .dots i.plan,.legend .lg.pl{background:var(--good)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78em;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend .lg.done{border-radius:2px;width:12px;background:var(--accent)}
.legend .lg.plan{border-radius:2px;width:12px;border:1.5px dashed var(--accent)}
@media (min-width:600px){.cal .day{min-height:84px}.cal .ev{font-size:.68em}}
.ccards{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.ccards{grid-template-columns:1fr 1fr}}
.ccard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface);min-width:0}
.cact{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.cact .btn{min-height:44px;padding:0 14px;flex:1 1 auto}
.btn.wa{background:#1f7a4a;border-color:#1f7a4a;color:#fff}
.crow{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line);min-height:64px}
.crow:last-child{border-bottom:0}
.cmain{flex:1;min-width:0;display:flex;gap:12px;align-items:center;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer}
.cmain .main{display:flex;flex-direction:column;min-width:0}
.cmain .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmain .s{font-size:.82em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-display);background:hsl(var(--h) 45% 86%);color:hsl(var(--h) 55% 26%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 30% 26%);color:hsl(var(--h) 60% 84%)}}
:root[data-theme="dark"] .av{background:hsl(var(--h) 30% 26%);color:hsl(var(--h) 60% 84%)}
.qb{display:flex;gap:8px;flex:none}
.qbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.qbtn svg{width:20px;height:20px;fill:currentColor}
.qbtn.call{background:var(--accent);color:var(--accent-ink)}
.qbtn.wa{background:#1f7a4a;color:#fff}
.qbtn.edit{background:var(--sunk);color:var(--muted);border:0;cursor:pointer}.qbtn.edit svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.chead{flex-wrap:nowrap}.chead .favbtn{margin-left:4px}
.ghead{font-family:var(--f-display);font-weight:700;font-size:.85em;letter-spacing:.06em;color:var(--accent);padding:4px 2px 0}
.chead{display:flex;gap:16px;align-items:flex-start}
.chead>div{flex:1}
.favbtn{flex:none;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.4em;cursor:pointer;color:var(--muted)}
.favbtn.on{color:#c98a00;border-color:#c98a00}
.star{color:#c98a00}
.logf{gap:10px;padding:12px;border:1px dashed var(--line);border-radius:8px}
.bwrap{overflow-x:auto;border-radius:6px}
.bill{background:#fff;color:#1e2226;border:1px solid var(--line);border-radius:6px;padding:0 0 16px;min-width:540px;font-size:12.5px;line-height:1.45;position:relative;overflow:hidden}
.bbar{height:6px;background:#0d7a78}
.bhead{display:flex;justify-content:space-between;gap:16px;padding:16px 20px 12px;border-bottom:1px solid #cdd4da}
.bname{font-family:var(--f-display);font-weight:800;font-size:22px;color:#3b4045;letter-spacing:.02em;line-height:1.15}
.bdes{color:#646c74;font-size:14px;margin-bottom:6px}
.baddr{font-size:12px}.bph{font-size:12px;font-weight:600}
.bmeta{text-align:right;flex:none}.btitle{font-family:var(--f-display);font-weight:800;color:#0d7a78;letter-spacing:.12em;font-size:15px;margin-bottom:6px}
.bmeta table{margin-left:auto;border-collapse:collapse}.bmeta td{padding:2px 0 2px 14px;font-size:12px}.bmeta td:first-child{color:#646c74}
.bto{padding:12px 20px}
.blab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#646c74;font-weight:700}
.bmill{font-weight:700;font-size:14px}
.bt{width:calc(100% - 40px);margin:0 20px;border-collapse:collapse}
.bt th{background:#3b4045;color:#fff;font-size:11px;letter-spacing:.06em;padding:7px 8px;text-align:left;text-transform:uppercase}
.bt td{padding:8px;border-bottom:1px solid #dfe4e8;vertical-align:top}
.bt .c{text-align:center}.bt .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.bpt{font-weight:700}.bsub{color:#646c74;font-size:11px;margin-top:2px}
.btot{margin:8px 20px 0 auto;width:min(300px,60%);display:flex;flex-direction:column;gap:2px}
.btot>div{display:flex;justify-content:space-between;padding:2px 8px}.btot .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btot .bgrand{background:#0d7a78;color:#fff;font-weight:800;font-size:14px;padding:7px 8px;margin-top:3px}

<body>
<header class="top"><div class="top-in">
  <button class="back" id="backBtn" hidden>‹ Back</button>
  <h1 id="title">RRS TEXCONPRO</h1>
  <span class="sync" id="sync">Loading…</span>
  <button class="back" id="gearBtn" aria-label="Settings" title="Settings">Settings</button>
</div></header>
<main id="app"><div class="panel"><p class="muted">Loading your records…</p></div></main>
<nav class="tabs" aria-label="Main"><div class="in" id="tabs"></div></nav>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD=iso=>{if(!iso)return"";const[y,m,d]=iso.split("-");return `${d}-${MON[+m-1]}-${y}`};
const addDays=(iso,n)=>{const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
// money is stored as integer paise
const toPaise=s=>{s=String(s??"").replace(/[,₹\s]/g,"");if(!s)return 0;const neg=s.startsWith("-");s=s.replace("-","");const[r,p=""]=s.split(".");const v=(parseInt(r||"0",10)*100)+parseInt((p+"00").slice(0,2),10);return isNaN(v)?0:(neg?-v:v)};
const inr=p=>{p=Math.round(p||0);const neg=p<0;p=Math.abs(p);const r=Math.floor(p/100),f=String(p%100).padStart(2,"0");let s=String(r);if(s.length>3){const last=s.slice(-3);s=s.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,",")+","+last}return (neg?"-":"")+s+"."+f};
const rupee=p=>"₹"+inr(p);
const inputRs=p=>p?(p/100).toFixed(2).replace(/\.00$/,""):"";
const fyOf=iso=>{const[y,m]=iso.split("-").map(Number);const s=m>=4?y:y-1;return `${s}-${String((s+1)%100).padStart(2,"0")}`};
const toast=msg=>{const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)};
function choose(msg,opts){return new Promise(res=>{const w=document.createElement("div");w.className="confirm";w.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p style="margin:0">${msg}</p><div class="row" style="justify-content:flex-end">${opts.map(o=>`<button class="btn ${o.cls||""}" data-k="${o.k}">${esc(o.label)}</button>`).join("")}</div></div>`;w.addEventListener("click",e=>{const k=e.target.closest("[data-k]")?.dataset.k;if(k||e.target===w){w.remove();res(k||null)}});document.body.appendChild(w);w.querySelector(".btn.pri")?.focus()})}
const normName=s=>String(s||"").toLowerCase().replace(/\b(mr|mrs|ms|dr|shri|sri|thiru|m\/s)\b\.?/g,"").replace(/\(.*?\)/g,"").replace(/[^a-z0-9]/g,"");
function editDist(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>3)return 9;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const similarName=(a,b)=>{const x=normName(a),y=normName(b);if(!x||!y)return false;if(x===y)return true;const d=editDist(x,y);return d<=(Math.max(x.length,y.length)>=8?2:1)};
function ask(msg,okLabel,danger){return new Promise(res=>{const w=document.createElement("div");w.className="confirm";w.innerHTML=`<div class="box" role="dialog" aria-modal="true"><p style="margin:0">${esc(msg)}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-a="0">Go back</button><button class="btn ${danger?"danger":"pri"}" data-a="1">${esc(okLabel)}</button></div></div>`;w.addEventListener("click",e=>{const a=e.target.dataset.a;if(a!==undefined||e.target===w){w.remove();res(a==="1")}});document.body.appendChild(w);w.querySelector('[data-a="1"]').focus()})}

/* ---------- storage: Supabase (his own account) with offline cache ---------- */
const COLLS=["mills","visits","invoices","payments","process","quality","production","machines","practices","notes","photos","plans","contacts"];
const S={settings:{},photoData:{}};COLLS.forEach(c=>S[c]={});
const SB_URL="https://kadmogqdalxvzekjajqt.supabase.co",SB_KEY="sb_publishable_SD-_Afw1sSLpHCVOj3dl-Q_-w24yGGN";
let sb=null,me=null,mode="loading",loaded=0,downloads=true,shared=false,myRole="user";
const photoCache={};
/* tiny IndexedDB key-value store for the offline copy */
const idb=(()=>{let dbp=null;const open=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open("rrs-texconpro",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(m,fn)=>{const db=await open();return new Promise((res,rej)=>{const t=db.transaction("kv",m);const q=fn(t.objectStore("kv"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
  return{get:k=>tx("readonly",s=>s.get(k)).catch(()=>null),set:(k,v)=>tx("readwrite",s=>s.put(v,k)).catch(()=>{}),del:k=>tx("readwrite",s=>s.delete(k)).catch(()=>{})}})();
const cacheKey=()=>"cache_"+(me?.id||"anon"),outKey=()=>"outbox_"+(me?.id||"anon");
let outbox=[],cacheTimer=null,flushing=false;
function saveCache(){clearTimeout(cacheTimer);cacheTimer=setTimeout(()=>{const{photoData,...rest}=S;idb.set(cacheKey(),rest)},400)}
function setSync(t){const e=$("#sync");if(e)e.textContent=t}
function syncLabel(){setSync(!navigator.onLine?`Offline${outbox.length?" · "+outbox.length+" to sync":""}`:outbox.length?`${outbox.length} waiting to sync`:"Synced ✓")}
async function queue(op){
  // keep only the latest change per record
  outbox=outbox.filter(o=>!(o.coll===op.coll&&o.id===op.id));outbox.push(op);await idb.set(outKey(),outbox);flush();
}
async function flush(){
  if(flushing||!sb||!me||!outbox.length)return syncLabel();
  if(!navigator.onLine)return syncLabel();
  flushing=true;setSync("Saving…");
  try{
    while(outbox.length){
      const op=outbox[0];let error;
      if(op.op==="put")({error}=await sb.from("records").upsert({owner:me.id,coll:op.coll,id:op.id,data:op.data,updated_at:new Date().toISOString(),...(shared?{updated_by:me.email}:{})},{onConflict:shared?"coll,id":"owner,coll,id"}));
      else ({error}=await sb.from("records").delete().match(shared?{coll:op.coll,id:op.id}:{owner:me.id,coll:op.coll,id:op.id}));
      if(error)throw error;
      outbox.shift();await idb.set(outKey(),outbox);
    }
  }catch(e){if(navigator.onLine&&!/fetch|network/i.test(e.message||""))toast("Couldn't save to the cloud: "+(e.message||"will retry"))}
  finally{flushing=false;syncLabel()}
}
window.addEventListener("online",flush);window.addEventListener("offline",syncLabel);setInterval(flush,30000);
async function put(coll,obj){
  S[coll][obj.id]=obj;render();saveCache();
  await queue({op:"put",coll,id:obj.id,data:JSON.parse(JSON.stringify(obj))});
}
async function del(coll,id){
  delete S[coll][id];render();saveCache();
  await queue({op:"del",coll,id});
}
async function putSettings(obj){
  S.settings=obj;applyPrefs();render();saveCache();
  await queue({op:"put",coll:"settings",id:"main",data:JSON.parse(JSON.stringify(obj))});return true;
}
const dataUrlToBlob=d=>{const[h,b]=d.split(",");const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:(h.match(/:(.*?);/)||[])[1]||"image/jpeg"})};
const blobToDataUrl=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function putPhotoData(id,data){
  photoCache[id]=data;
  const{error}=await sb.storage.from("photos").upload(photoKey(id),dataUrlToBlob(data),{contentType:"image/jpeg",upsert:true});
  if(error){await idb.set("photo_"+id,data);throw new Error(navigator.onLine?error.message:"No internet. The photo is kept on this phone; add it again when online.")}
}
async function getPhotoData(id){
  if(photoCache[id])return photoCache[id];
  let{data,error}=await sb.storage.from("photos").download(photoKey(id));
  if((error||!data)&&shared){const p=await sb.rpc("photo_path",{pid:id});if(p.data)({data,error}=await sb.storage.from("photos").download(p.data))} // photos saved before sharing was switched on
  if(error||!data){return (await idb.get("photo_"+id))||""}
  return photoCache[id]=await blobToDataUrl(data);
}
const photoKey=id=>shared?`shared/${id}.jpg`:`${me.id}/${id}.jpg`;
async function delPhoto(id){delete photoCache[id];try{await sb.storage.from("photos").remove([photoKey(id)])}catch(e){}await del("photos",id)}

const DEFAULT_SETTINGS={bizName:"R. Ramasubramanian",consultantName:"R. Ramasubramanian",designation:"Textile Consultant",address:"1, A.K.M.G. Nagar, Opp. R.V.S. Working Women's Hostel,\nKarur Road, Dindigul - 624 001.",phone:"80547 78888",phone2:"94430 21399",email:"",gstin:"",prefix:"TC",nextNo:{},defaultFee:0,payTermsDays:30,bank:"",upi:"",acc1Name:"HDFC Bank",acc1Details:"",acc2Name:"ICICI Bank",acc2Details:"",billAccount:"1",lastBackup:"",signature:"",bigText:false,invoiceNote:"Kindly arrange payment as per the agreed terms."};
const IDENT=["bizName","consultantName","designation","address","phone","phone2"];
const settings=()=>{const o=Object.assign({},DEFAULT_SETTINGS,S.settings||{});IDENT.forEach(k=>{if(!o[k])o[k]=DEFAULT_SETTINGS[k]});return o};
function accounts(s=settings()){return [{k:"1",name:s.acc1Name||"HDFC Bank",details:s.acc1Details||s.bank||""},{k:"2",name:s.acc2Name||"ICICI Bank",details:s.acc2Details||""}]}
function bankLines(s,choice){const a=accounts(s);const pick=choice==="both"?a:a.filter(x=>x.k===(choice||s.billAccount||"1"));return pick.filter(x=>x.details).map(x=>`${x.name}: ${x.details}`)}
function applyPrefs(){document.documentElement.classList.toggle("big",!!settings().bigText)}
const lsSave=()=>saveCache();

async function loadAll(){
  const rows=[];for(let from=0;;from+=1000){const{data,error}=await sb.from("records").select("coll,id,data").range(from,from+999);if(error)throw error;rows.push(...data);if(data.length<1000)break}
  const fresh={settings:{}};COLLS.forEach(c=>fresh[c]={});
  rows.forEach(r=>{if(r.coll==="settings")fresh.settings=r.data;else if(fresh[r.coll])fresh[r.coll][r.id]=r.data});
  // keep local changes that are still waiting to sync
  outbox.forEach(o=>{if(o.coll==="settings"){if(o.op==="put")fresh.settings=o.data}else if(fresh[o.coll]){if(o.op==="put")fresh[o.coll][o.id]=o.data;else delete fresh[o.coll][o.id]}});
  Object.assign(S,fresh);saveCache();
}
function listen(){
  sb.channel("records-"+me.id).on("postgres_changes",{event:"*",schema:"public",table:"records",...(shared?{}:{filter:`owner=eq.${me.id}`})},p=>{
    const r=p.new&&p.new.coll?p.new:p.old;if(!r||!r.coll)return;
    if(outbox.some(o=>o.coll===r.coll&&o.id===r.id))return; // our own pending change wins
    if(p.eventType==="DELETE"){if(S[r.coll])delete S[r.coll][r.id]}
    else if(r.coll==="settings"){S.settings=r.data;applyPrefs()}else if(S[r.coll])S[r.coll][r.id]=r.data;
    saveCache();render();
  }).subscribe();
}
async function startSession(user){
  me=user;mode="cloud";
  // who may use the app is decided in the database (app_users list); older databases without the list run in single-user mode
  const r=await sb.rpc("my_role");
  if(r.error&&/my_role|PGRST202|function/i.test((r.error.message||"")+(r.error.code||""))){shared=false;myRole="admin"}
  else if(r.error){if(!navigator.onLine){shared=true;myRole=(await idb.get("role_"+me.id))||"user"}else{toast("Couldn't check access: "+r.error.message)}}
  else if(!r.data){$("#app").innerHTML=`<div class="authbox"><div class="authlogo">RRS<br>TEXCONPRO</div><div class="note"><b>${esc(me.email)}</b> doesn't have access to this app. Ask the administrator to add your email.</div><button class="btn" id="soNo">Sign out</button></div>`;document.querySelector("nav.tabs").hidden=true;$("#gearBtn").hidden=true;$("#soNo").onclick=async()=>{await sb.auth.signOut();location.reload()};return}
  else{shared=true;myRole=r.data;idb.set("role_"+me.id,myRole)}
  outbox=(await idb.get(outKey()))||[];
  const cached=await idb.get(cacheKey());
  if(cached){Object.assign(S,cached);loaded=1;applyPrefs();render()}
  try{await loadAll()}catch(e){
    if(/records|schema cache|does not exist|PGRST205|42P01/i.test((e.message||"")+(e.code||""))){$("#app").innerHTML=`<div class="note"><b>The database isn't set up yet.</b> In Supabase, open SQL Editor, paste the contents of RRS_TEXCONPRO_database_setup.sql and press Run. Then reload this page.</div>`;return}
    if(!cached)toast("Couldn't load your records: "+(e.message||"check internet"))}
  loaded=1;applyPrefs();render();listen();flush();syncLabel();
}

/* ---------- sign in ---------- */
function authScreen(msg){
  loaded=0;document.querySelector("nav.tabs").hidden=true;$("#backBtn").hidden=true;$("#gearBtn").hidden=true;setSync("");$("#title").textContent="RRS TEXCONPRO";
  $("#app").innerHTML=`<div class="authbox"><div class="authlogo">RRS<br>TEXCONPRO</div><p class="muted" style="margin:0;text-align:center">Textile consultancy records, billing and reports</p>
  ${msg?`<div class="note info">${msg}</div>`:""}
  <form id="af" autocomplete="on"><div class="f"><label for="aemail">Email</label><input id="aemail" name="email" type="email" autocomplete="username" inputmode="email" value="${esc((()=>{try{return localStorage.getItem("rrs_email")||""}catch(e){return ""}})())}" required></div>
  <div class="f"><label for="apass">Password</label><input id="apass" name="password" type="password" autocomplete="current-password" minlength="6" required></div>
  <label class="check on" id="remL"><input type="checkbox" id="arem" checked><span>Remember my email on this phone</span></label>
  <button class="btn pri" type="submit" id="asub">Sign in</button>
  <div class="row" style="justify-content:space-between"><button type="button" class="linkbtn" id="aforgot">Forgot password?</button><button type="button" class="linkbtn" id="anew">First time? Create account</button></div></form></div>`;
  let creating=false;const f=$("#af");
  $("#arem").onchange=e=>$("#remL").classList.toggle("on",e.target.checked);
  if(f.elements.email.value)setTimeout(()=>f.elements.password.focus(),50);
  $("#anew").onclick=()=>{creating=!creating;$("#asub").textContent=creating?"Create account":"Sign in";$("#anew").textContent=creating?"Have an account? Sign in":"First time? Create account";f.elements.password.autocomplete=creating?"new-password":"current-password"};
  $("#aforgot").onclick=async()=>{const em=f.elements.email.value.trim();if(!em){toast("Type your email first");return}const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin});toast(error?error.message:"Password reset link sent to "+em)};
  f.onsubmit=async e=>{e.preventDefault();const email=f.elements.email.value.trim().toLowerCase(),password=f.elements.password.value;$("#asub").disabled=true;
    try{if($("#arem").checked)localStorage.setItem("rrs_email",email);else localStorage.removeItem("rrs_email")}catch(_){}
    try{if(creating){const{data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin}});if(error)throw error;if(!data.session){authScreen(`Account created. Open the confirmation email sent to <b>${esc(email)}</b>, tap the link, then sign in here.`);return}}
      else{const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}}
    catch(err){toast(/Invalid login/i.test(err.message)?"Email or password is wrong":/not confirmed/i.test(err.message)?"Please confirm your email first (check your inbox)":/saving new user|not allowed/i.test(err.message)?"This email isn't allowed to use the app. Ask the administrator.":err.message);$("#asub").disabled=false}};
}
function newPasswordScreen(){
  $("#app").innerHTML=`<div class="authbox"><h2>Set a new password</h2><form id="npf"><div class="f"><label for="np">New password</label><input id="np" type="password" minlength="6" autocomplete="new-password" required></div><button class="btn pri" type="submit">Save password</button></form></div>`;
  $("#npf").onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.updateUser({password:$("#np").value});toast(error?error.message:"Password changed");if(!error)location.hash=""};
}
async function signOut(){if(outbox.length&&!(await ask(`${outbox.length} change${outbox.length>1?"s have":" has"} not reached the cloud yet. Sign out anyway? They stay on this phone and sync next time you sign in here.`,"Sign out",true)))return;await sb.auth.signOut();location.reload()}

async function boot(){
  if(!window.supabase||SB_URL.startsWith("__")){$("#app").innerHTML=`<div class="note">${!window.supabase?"Couldn't load the app. Check your internet connection and reload.":"This copy of the app isn't connected to a database yet."}</div>`;return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let started=false;
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){newPasswordScreen();return}
    if(session?.user&&!started){started=true;document.querySelector("nav.tabs").hidden=false;$("#gearBtn").hidden=false;startSession(session.user)}
    if(!session&&ev==="SIGNED_OUT"){started=false;authScreen()}
  });
  const{data:{session}}=await sb.auth.getSession();
  if(!session)authScreen();
}

/* ---------- derived data ---------- */
const arr=c=>Object.values(S[c]);
const millName=id=>S.mills[id]?.name||"Unknown mill";
function invPaid(inv){const ps=arr("payments").filter(p=>p.invoiceId===inv.id);const cash=ps.reduce((a,p)=>a+(p.amount||0),0),tds=ps.reduce((a,p)=>a+(p.tds||0),0);return{cash,tds,balance:(inv.total||0)-cash-tds,ps}}
function invStatus(inv){
  if(inv.status==="Draft")return{l:"Draft",c:""};
  if(inv.status==="Cancelled")return{l:"Cancelled",c:""};
  const{cash,tds,balance}=invPaid(inv);
  if(balance<=0)return{l:"Paid",c:"good"};
  const due=addDays(inv.date,inv.payTermsDays??30);
  if(due<todayISO())return{l:(cash+tds>0?"Part paid · ":"")+"Overdue",c:"bad"};
  if(cash+tds>0)return{l:"Part paid",c:"warn"};
  return{l:"Issued",c:"acc"};
}
function visitBill(v){if(!v.invoiceId)return null;const i=S.invoices[v.invoiceId];if(!i||i.status==="Cancelled")return null;return i}
function visitPill(v){
  const b=visitBill(v);
  if(v.status!=="Completed")return `<span class="pill ${v.status==="Planned"?"acc":""}">${esc(v.status)}</span>`;
  if(b)return `<span class="pill good">Billed${b.no?" · "+esc(b.no):" (draft)"}</span>`;
  return `<span class="pill warn">Unbilled</span>`;
}

let stack=[{v:"home"}];
const TABS=[["home","Home",'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>'],["mills","Mills",'<path d="M3 21V10l5 3V10l5 3V6l8 4v11z"/><path d="M3 21h18"/>'],["contacts","Contacts",'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>'],["visits","Visits",'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>'],["plan","Plan",'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3M8 17h6"/>'],["reports","Reports",'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],["bills","Billing",'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>']];
$("#gearBtn").onclick=()=>tab("settings");
/* navigation: the on-screen Back and the phone's back gesture both step back one page, ending on Home */
let navDepth=0,progBack=false;
function pushHist(){try{history.pushState({rrs:Date.now()},"");navDepth++}catch(e){}}
function go(v,p={}){if(v==="invoiceForm")VIEWS.invoiceForm.st=null;dirty=false;stack.push({v,...p});pushHist();render();window.scrollTo(0,0)}
function tab(v){dirty=false;const atHome=stack.length===1&&stack[0].v==="home";stack=[{v}];if(!(v==="home"&&atHome))pushHist();render();window.scrollTo(0,0)}
function doBack(){dirty=false;if(stack.length>1)stack.pop();else if(stack[0].v!=="home")stack=[{v:"home"}];render();window.scrollTo(0,0)}
function back(){if(navDepth>0){progBack=true;try{history.back();return}catch(e){progBack=false}}doBack()}
const unsaved=()=>dirty&&$("#app form");
$("#backBtn").onclick=async()=>{if(unsaved()&&!(await ask("You have changes that aren't saved. Leave this page without saving?","Leave without saving",true)))return;back()};
window.addEventListener("popstate",async()=>{navDepth=Math.max(0,navDepth-1);const prog=progBack;progBack=false;
  if(!prog&&unsaved()){if(!(await ask("You have changes that aren't saved. Leave this page without saving?","Leave without saving",true))){pushHist();return}}
  doBack()});
$("#tabs").innerHTML=TABS.map(([k,l,ic])=>`<button data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">${ic}</svg>${l}</button>`).join("");
$("#tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(b)tab(b.dataset.tab)};

let dirty=false;
function render(){
  if(!loaded)return;
  if(dirty&&$("#app form"))return; // don't wipe a form with unsaved typing; navigation clears this
  const cur=stack[stack.length-1];
  $("#backBtn").hidden=stack.length<2&&stack[0].v==="home";
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===stack[0].v));
  const V=VIEWS[cur.v]||VIEWS.home;const out=V(cur);
  $("#title").textContent=out.title;$("#app").innerHTML=out.html;
  dirty=false;out.after&&out.after();
}

/* Visits list */
let visitFilter="All",visitQ="";
VIEWS.visits=()=>{
  const fs=["All","Planned","Draft","Unbilled","Billed"];
  let vs=arr("visits").sort((a,b)=>(b.date+(b.start||"")).localeCompare(a.date+(a.start||"")));

  if(visitFilter==="Draft")vs=vs.filter(v=>v.status==="Draft");
  if(visitFilter==="Unbilled")vs=vs.filter(v=>v.status==="Completed"&&!visitBill(v));
  if(visitFilter==="Billed")vs=vs.filter(v=>visitBill(v));
  const q=visitQ.toLowerCase();if(q)vs=vs.filter(v=>[millName(v.millId),v.purpose,v.observations,v.recommendations,v.dept,v.persons].join(" ").toLowerCase().includes(q));

function millOptions(sel){const ms=arr("mills").sort((a,b)=>a.name.localeCompare(b.name));return `<option value="">Choose a mill…</option>`+ms.map(m=>`<option value="${m.id}" ${m.id===sel?"selected":""}>${esc(m.name)}${m.city?" — "+esc(m.city):""}</option>`).join("")}

function openPoints(millId,exceptId){

let billFilter="All";

  if(billFilter==="Overdue")is=is.filter(i=>i.status==="Issued"&&invStatus(i).c==="bad");

  const issued=arr("invoices").filter(i=>i.status==="Issued"),fy=fyOf(todayISO());

  `<div class="list">${is.length?is.map(invItem).join(""):`<div class="empty">No bills here.</div>`}</div>`}

function calcInvoice(lines,expenses,discount,taxMode,rateBp){
  const fees=lines.reduce((a,l)=>a+l.amount,0);
  const taxable=Math.max(0,fees+expenses-discount);
  const tax=taxMode==="none"?0:Math.round(taxable*rateBp/10000);
  let cgst=0,sgst=0,igst=0;if(taxMode==="intra"){cgst=Math.round(tax/2);sgst=tax-cgst}else if(taxMode==="inter")igst=tax;
  return{fees,taxable,tax,cgst,sgst,igst,total:taxable+tax};
}

function words(p){const r=Math.floor(p/100),ps=p%100;const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"],b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two=n=>n<20?a[n]:b[Math.floor(n/10)]+(n%10?" "+a[n%10]:"");const three=n=>(n>=100?a[Math.floor(n/100)]+" Hundred"+(n%100?" ":""):"")+(n%100?two(n%100):"");
  let n=r,out=[];const cr=Math.floor(n/1e7);n%=1e7;const lk=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
  if(cr)out.push(three(cr)+" Crore");if(lk)out.push(two(lk)+" Lakh");if(th)out.push(two(th)+" Thousand");if(n)out.push(three(n));
  return "Rupees "+(out.join(" ")||"Zero")+(ps?" and "+two(ps)+" Paise":"")+" Only"}
async function saveFile(name,data){
  if(!downloads){toast("Downloads aren't available in this view. Open the app in claude.ai while signed in.");return false}
  try{await downloads.save({filename:name,data});toast("Saved "+name);return true}catch(e){if(e?.code==="rejected_extension")toast("This file type can't be saved here. Use the Excel backup instead.");else if(e?.code!=="declined")toast("Couldn't save: "+(e?.message||e?.code||"unknown"));return false}
}
function exportCSV(){
  const rows=[["Invoice No","Date","Mill","Period","Taxable","CGST","SGST","IGST","Total","Received","TDS","Balance","Status"]];
  arr("invoices").filter(i=>i.status!=="Draft").sort((a,b)=>a.date.localeCompare(b.date)).forEach(i=>{const{cash,tds,balance}=invPaid(i);rows.push([i.no,i.date,millName(i.millId),i.period,...[i.taxable,i.cgst,i.sgst,i.igst,i.total,cash,tds,i.status==="Cancelled"?0:balance].map(v=>(v/100).toFixed(2)),invStatus(i).l])});
  saveFile(`bills_${todayISO()}.csv`,rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n"));
}

let gq="";
VIEWS.search=()=>{
  const q=gq.trim().toLowerCase();let res=[];
  if(q.length>1){
    const hit=t=>t.toLowerCase().includes(q);
    arr("mills").forEach(m=>{if(hit([m.name,m.group,m.city,m.contactName,m.machinery,m.counts,m.notes].join(" ")))res.push(`<button class="item" ${goAttr("mill",{id:m.id})}><div class="main"><div class="t">${esc(m.name)}</div><div class="s">Mill</div></div></button>`)});

const recDate=r=>r.date||"";
const byDateDesc=(a,b)=>(recDate(b)+(b.updated||0)).localeCompare(recDate(a)+(a.updated||0));
const machLabel=id=>{const m=S.machines[id];return m?`${m.no}${m.type?" ("+m.type+")":""}`:""};
const machOf=r=>r.machineId?machLabel(r.machineId):(r.machineText||"");

function recTitle(k,r){
  if(k==="process")return `${r.dept||"Process"}${machOf(r)?" · "+machOf(r):""}`;
  if(k==="quality")return `${r.sampleType||"Quality"}${r.count?" · "+r.count:""}${machOf(r)?" · "+machOf(r):""}`;
  if(k==="production")return `${r.dept||"Production"} · ${r.period||"Day"}${machOf(r)?" · "+machOf(r):""}`;
  if(k==="machines")return `${r.no}${r.type?" · "+r.type:""}`;
  if(k==="practices")return r.title||"Best practice";
  if(k==="notes")return r.title||"Note";
  if(k==="photos")return r.caption||"Photo";
  if(k==="plans")return r.title||"Plan";
  if(k==="contacts")return r.name;
}
function recSub(k,r){
  const mill=r.millId?millName(r.millId):"";
  if(k==="process"||k==="quality")return [fmtD(r.date),mill,(r.params||[]).filter(p=>p.actual!=="").slice(0,3).map(p=>`${p.name} ${p.actual}${p.unit?" "+p.unit:""}`).join(", ")].filter(Boolean).join(" · ");
  if(k==="production"){const e=effOf(r);return [fmtD(r.date),mill,r.actual?`${r.actual} ${r.unit||"kg"}`:"",e!=null?`eff ${e}%`:""].filter(Boolean).join(" · ")}
  if(k==="machines")return [mill,r.make,r.model,r.dept].filter(Boolean).join(" · ");
  if(k==="practices")return [r.category,r.millId?mill:"General",r.dept].filter(Boolean).join(" · ");
  if(k==="plans")return [r.millId?mill:"General",r.status,r.targetDate?"by "+fmtD(r.targetDate):""].filter(Boolean).join(" · ");
  if(k==="contacts")return [r.role,mill,r.phone].filter(Boolean).join(" · ");
  return [fmtD(r.date),mill].filter(Boolean).join(" · ");
}
function recItem(k,r){
  const K=KIND[k];
  const right=k==="practices"?`<span class="pill vis ${r.visibility==="Knowledge library"?"good":r.visibility==="Private notes"?"":"acc"}">${esc(r.visibility||"Private notes")}</span>`:k==="machines"&&r.status&&r.status!=="Running"?`<span class="pill warn">${esc(r.status)}</span>`:"";
  const thumb=k==="photos"&&r.thumb?`<img src="${r.thumb}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:6px;flex:none">`:`<span class="ic" style="flex:none;width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-size:.78em">${K.ic}</span>`;
  return `<button class="item" ${goAttr(K.view,{kind:k,id:r.id})}>${thumb}<div class="main"><div class="t">${esc(recTitle(k,r))}</div><div class="s">${esc(recSub(k,r))}</div></div><div class="r">${right}</div></button>`;
}
function recentTech(n){
  const all=[];["process","quality","production","practices","notes","photos"].forEach(k=>arr(k).forEach(r=>all.push([k,r])));
  all.sort((a,b)=>byDateDesc(a[1],b[1]));
  if(!all.length)return "";
  return `<section class="panel"><h2>Recent technical records</h2><div class="list">${all.slice(0,n).map(([k,r])=>recItem(k,r)).join("")}</div></section>`;
}
function followUps(){
  const out=[];
  arr("visits").forEach(v=>{if(v.followDate&&!v.followDone&&v.status!=="Cancelled")out.push({date:v.followDate,millId:v.millId,text:v.followUp||"Follow-up",view:"visit",p:{id:v.id}})});
  ["process","quality","production"].forEach(k=>arr(k).forEach(r=>{if(r.followDate&&!r.followDone)out.push({date:r.followDate,millId:r.millId,text:(r.recommendation||r.action||recTitle(k,r)).split("\n")[0],view:KIND[k].view,p:{kind:k,id:r.id}})}));
  arr("contacts").forEach(c=>(c.log||[]).forEach(l=>{if(l.follow&&!l.done)out.push({date:l.follow,millId:c.millId,text:`Call back ${c.name}${l.note?": "+l.note.split("\n")[0]:""}`,view:"contact",p:{id:c.id}})}));
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

/* ---------- small form builders ---------- */
const inp=(k,l,v,o={})=>`<div class="f"><label for="${k}">${l}</label><input id="${k}" name="${k}" type="${o.type||"text"}" value="${esc(v??"")}"${o.ph?` placeholder="${esc(o.ph)}"`:""}${o.list?` list="${o.list}"`:""}${o.req?" required":""}${o.im?` inputmode="${o.im}"`:""}>${o.hint?`<span class="hint">${o.hint}</span>`:""}</div>`;
const ta=(k,l,v,o={})=>`<div class="f"><label for="${k}">${l}</label><textarea id="${k}" name="${k}"${o.ph?` placeholder="${esc(o.ph)}"`:""}${o.h?` style="min-height:${o.h}px"`:""}>${esc(v??"")}</textarea>${o.hint?`<span class="hint">${o.hint}</span>`:""}</div>`;
const customList=key=>(settings().custom||{})[key]||[];
function withCustom(key,base){const b=base.filter(x=>(Array.isArray(x)?x[0]:x)!=="Other");const have=new Set(b.map(x=>Array.isArray(x)?x[0]:x));return [...b,...customList(key).filter(x=>!have.has(x))]}
const sel=(k,l,v,opts,o={})=>{let list=o.add?withCustom(o.add,opts):opts;if(o.add&&v&&!list.some(x=>String(Array.isArray(x)?x[0]:x)===String(v)))list=[...list,v];
  return `<div class="f"><label for="${k}">${l}</label><select id="${k}" name="${k}"${o.add?` data-add="${o.add}" data-label="${esc(String(l).replace(/[*:]/g,"").trim().toLowerCase())}"`:""}>${o.blank!=null?`<option value="">${esc(o.blank)}</option>`:""}${list.map(x=>{const[val,lab]=Array.isArray(x)?x:[x,x];return `<option value="${esc(val)}" ${String(val)===String(v??"")?"selected":""}>${esc(lab)}</option>`}).join("")}${o.add?`<option value="__new__">+ Add new…</option>`:""}</select></div>`};
// "+ Add new…" in any list: type a new entry inline; it is kept for next time
document.addEventListener("focusin",e=>{if(e.target.tagName==="SELECT"&&e.target.dataset.add&&e.target.value!=="__new__")e.target.dataset.prev=e.target.value});
document.addEventListener("change",e=>{const s=e.target;if(s.tagName!=="SELECT"||s.value!=="__new__"||!s.dataset.add)return;
  s.value=s.dataset.prev||"";const f=s.closest(".f");if(f.nextElementSibling?.classList.contains("addnew")){f.nextElementSibling.querySelector("input").focus();return}
  f.insertAdjacentHTML("afterend",`<div class="addnew"><input type="text" placeholder="New ${esc(s.dataset.label||"entry")}" aria-label="New ${esc(s.dataset.label||"entry")}"><button type="button" class="btn pri" data-an="add">Add</button><button type="button" class="btn" data-an="x">Cancel</button></div>`);
  const box=f.nextElementSibling,inpt=box.querySelector("input");inpt.focus();dirty=true;
  const done=()=>{box.remove();s.focus()};
  const add=()=>{const val=inpt.value.trim();if(!val){inpt.focus();return}
    let opt=[...s.options].find(o=>o.value.toLowerCase()===val.toLowerCase());
    if(!opt){opt=document.createElement("option");opt.value=opt.textContent=val;s.insertBefore(opt,s.querySelector('option[value="__new__"]'))}
    s.value=opt.value;s.dataset.prev=opt.value;done();s.dispatchEvent(new Event("change",{bubbles:true}));
    const key=s.dataset.add,cur=customList(key);if(!cur.some(x=>x.toLowerCase()===val.toLowerCase()))saveCustom(key,[...cur,val]);toast(`"${val}" added`)};
  box.querySelector('[data-an="add"]').onclick=add;box.querySelector('[data-an="x"]').onclick=done;
  inpt.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();add()}else if(ev.key==="Escape")done()});
});
async function saveCustom(key,list){const ns={...settings(),custom:{...(settings().custom||{}),[key]:list}};S.settings=ns;saveCache();await queue({op:"put",coll:"settings",id:"main",data:JSON.parse(JSON.stringify(ns))})}
const dlist=(id,vals)=>`<datalist id="${id}">${[...new Set(vals.filter(Boolean))].slice(0,80).map(v=>`<option value="${esc(v)}">`).join("")}</datalist>`;
const machineOpts=millId=>arr("machines").filter(m=>m.millId===millId).sort((a,b)=>a.no.localeCompare(b.no,undefined,{numeric:true})).map(m=>[m.id,`${m.no}${m.type?" — "+m.type:""}`]);
const visitOpts=millId=>arr("visits").filter(v=>v.millId===millId&&v.status!=="Planned"&&v.status!=="Cancelled").sort((a,b)=>b.date.localeCompare(a.date)).slice(0,40).map(v=>[v.id,`${fmtD(v.date)}${v.purpose?" — "+v.purpose:""}`]);

function ctxDefaults(p){

function needMill(title){return arr("mills").length?null:{title,html:`<div class="panel"><p style="margin:0">Add a mill first. Every technical record belongs to a mill.</p><button class="btn pri" ${goAttr("millForm",{})}>Add a mill</button></div>`}}
async function saveRec(k,obj,label){dirty=false;obj.updated=Date.now();await put(k,obj);toast((label||KIND[k].one)+" saved");stack.pop();stack.push({v:KIND[k].view,kind:k,id:obj.id});render()}
async function delRec(k,r){if(!(await ask(`Delete this ${KIND[k].one.toLowerCase()}? This can't be undone.`,"Delete",true)))return;await del(k,r.id);toast("Deleted");back()}

/* ---------- process & quality (parameter tables) ---------- */
const prow=p=>`<div class="prow"><input class="pn" data-k="name" value="${esc(p.name)}" placeholder="Parameter" list="pnames" aria-label="Parameter"><input data-k="unit" value="${esc(p.unit)}" placeholder="Unit" aria-label="Unit"><input data-k="actual" value="${esc(p.actual)}" placeholder="Actual" aria-label="Actual value"><input data-k="target" value="${esc(p.target)}" placeholder="Target" aria-label="Target or recommended"><button type="button" class="x" aria-label="Remove row">×</button></div>`;
const presetRows=list=>list.map(([name,unit])=>({name,unit,actual:"",target:""}));
function readRows(){return [...document.querySelectorAll("#pt .prow")].map(row=>{const o={};row.querySelectorAll("input").forEach(i=>o[i.dataset.k]=i.value.trim());return o}).filter(p=>p.name&&(p.actual!==""||p.target!==""))}
function allParamNames(){const n=[];["process","quality"].forEach(k=>arr(k).forEach(r=>(r.params||[]).forEach(p=>n.push(p.name))));Object.values(PROC).concat(Object.values(QUAL)).forEach(l=>l.forEach(x=>n.push(x[0])));return n}
function lastTargets(millId,group,groupKey,kind){
  // carry forward the consultant's own targets from the latest record of the same mill & dept
  const prev=arr(kind).filter(r=>r.millId===millId&&r[groupKey]===group).sort(byDateDesc)[0];
  const t={};(prev?.params||[]).forEach(p=>{if(p.target)t[p.name.toLowerCase()]=p.target});return t;
}

  </fieldset>

    f.elements[gk].onchange=()=>{const hasData=readRows().some(x=>x.actual!=="");if(hasData)return;pt.innerHTML=(presetRows(presets[f.elements[gk].value]||[]).map(prow).join(""))||prow({name:"",unit:"",actual:"",target:""})};
    $("#fillT").onclick=()=>{const t=lastTargets(f.elements.millId.value,f.elements[gk].value,gk,kind);let n=0;pt.querySelectorAll(".prow").forEach(row=>{const nmv=row.querySelector('[data-k="name"]').value.toLowerCase(),ti=row.querySelector('[data-k="target"]');if(t[nmv]&&!ti.value){ti.value=t[nmv];n++}});toast(n?`Filled ${n} target${n>1?"s":""}`:"No earlier targets for this mill and "+(isP?"department":"sample type"))};
    f.onsubmit=e=>{e.preventDefault();const d=formData(f);if(!d.millId){toast("Choose a mill");return}const params=readRows();if(!params.length&&!d.observation){toast("Enter at least one value or an observation");return}
      saveRec(kind,{...r,...d,params,kind})};
  }};
};

function prevRec(kind,r){
  const gk=kind==="process"?"dept":"sampleType";
  return arr(kind).filter(x=>x.id!==r.id&&x.millId===r.millId&&x[gk]===r[gk]&&(r.machineId?x.machineId===r.machineId:true)&&(r.machineText&&!r.machineId?x.machineText===r.machineText:true)&&recDate(x)<=recDate(r)&&!(recDate(x)===recDate(r)&&(x.updated||0)>(r.updated||0))).sort(byDateDesc)[0];
}
const numv=s=>{const n=parseFloat(String(s).replace(/,/g,""));return isNaN(n)?null:n};
function deltaStr(a,b){const x=numv(a),y=numv(b);if(x==null||y==null||x===y)return "";const d=x-y;const dp=Math.max((String(a).split(".")[1]||"").length,(String(b).split(".")[1]||"").length);return (d>0?"+":"")+d.toFixed(Math.min(dp,3))}

function followPanel(k,r){if(!r.followDate)return "";return `<div class="panel"><div class="spread"><span class="eyebrow">Follow-up</span>${r.followDone?`<span class="pill good">Done</span>`:`<span class="pill ${r.followDate<todayISO()?"bad":"warn"}">Due ${fmtD(r.followDate)}</span>`}</div>${!r.followDone?`<button class="btn" id="fdone">Mark follow-up done</button>`:""}</div>`}

/* ---------- trend of one parameter at one mill ---------- */
function lineChart(pts,{target}={}){
  if(pts.length<2)return "";
  const W=340,H=160,pl=40,pr=10,pt=12,pb=26;const ys=pts.map(p=>p.y).concat(target!=null?[target]:[]);let lo=Math.min(...ys),hi=Math.max(...ys);if(lo===hi){lo-=1;hi+=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const t0=new Date(pts[0].x).getTime(),t1=new Date(pts[pts.length-1].x).getTime()||t0+1;
  const X=x=>pl+(W-pl-pr)*((new Date(x).getTime()-t0)/((t1-t0)||1)),Y=y=>pt+(H-pt-pb)*(1-(y-lo)/(hi-lo));
  const fmt=v=>Math.abs(v)>=100?v.toFixed(0):Math.abs(v)>=10?v.toFixed(1):v.toFixed(2);
  const ticks=[lo+pad,(lo+hi)/2,hi-pad];
  const d=pts.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+","+Y(p.y).toFixed(1)).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">
  ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-width="1"/><text x="${pl-5}" y="${Y(v)+3}" text-anchor="end">${fmt(v)}</text>`).join("")}
  ${target!=null?`<line x1="${pl}" x2="${W-pr}" y1="${Y(target)}" y2="${Y(target)}" style="stroke:var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-pr}" y="${Y(target)-4}" text-anchor="end" style="fill:var(--good)">target ${esc(target)}</text>`:""}
  <path d="${d}" fill="none" style="stroke:var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${i===pts.length-1?4.5:3}" style="fill:${i===pts.length-1?"var(--accent)":"var(--surface)"};stroke:var(--accent)" stroke-width="2"/>`).join("")}
  <text x="${pl}" y="${H-6}">${fmtD(pts[0].x)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${fmtD(pts[pts.length-1].x)}</text></svg>`;
}
VIEWS.trend=({millId,name,mach=""})=>{
  const key=name.toLowerCase();const rows=[];
  ["process","quality"].forEach(k=>arr(k).filter(r=>r.millId===millId).forEach(r=>(r.params||[]).forEach(p=>{if(p.name.toLowerCase()===key)rows.push({k,r,p,m:machOf(r)})})));
  const machs=[...new Set(rows.map(x=>x.m).filter(Boolean))];
  const shown=rows.filter(x=>!mach||x.m===mach).sort((a,b)=>recDate(a.r).localeCompare(recDate(b.r)));
  const pts=shown.map(x=>({x:x.r.date,y:numv(x.p.actual)})).filter(p=>p.y!=null);
  const lastT=[...shown].reverse().find(x=>numv(x.p.target)!=null);
  const unit=shown.find(x=>x.p.unit)?.p.unit||"";
  return{title:name,html:`<div><span class="eyebrow">${esc(millName(millId))}</span><h2>${esc(name)}${unit?` <span class="muted">(${esc(unit)})</span>`:""}</h2></div>
  ${machs.length>1?`<div class="chips"><button class="chip ${!mach?"on":""}" data-m="">All machines</button>${machs.map(m=>`<button class="chip ${m===mach?"on":""}" data-m="${esc(m)}">${esc(m)}</button>`).join("")}</div>`:""}
  ${pts.length>=2?`<div class="panel">${lineChart(pts,{target:lastT?numv(lastT.p.target):null})}</div>`:`<div class="note info">Record this parameter on at least two dates to see a trend line.</div>`}
  <div class="panel"><div class="scroll"><table class="dtable"><thead><tr><th>Date</th><th>Machine / dept</th><th class="n">Actual</th><th class="n">Target</th></tr></thead><tbody>${[...shown].reverse().map(x=>`<tr><td><button class="linkbtn" ${goAttr("tech",{kind:x.k,id:x.r.id})}>${fmtD(x.r.date)}</button></td><td>${esc(x.m||x.r.dept||x.r.sampleType||"")}</td><td class="n"><b>${esc(x.p.actual)}</b></td><td class="n muted">${esc(x.p.target)}</td></tr>`).join("")}</tbody></table></div></div>`,
  after(){document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{stack[stack.length-1].mach=b.dataset.m;render()})}};
};

function photoStrip(filter,ctx,always){
  const ps=arr("photos").filter(filter).sort(byDateDesc);
  if(!ps.length&&!always)return `<button class="btn" ${goAttr("photoForm",ctx)}>+ Add photos</button>`;
  return `<section class="panel"><div class="spread"><h2>Photos</h2><button class="linkbtn" ${goAttr("photoForm",ctx)}>+ Add photos</button></div>${ps.length?photoGrid(ps):`<p class="muted small" style="margin:0">No photos yet.</p>`}</section>`;
}
const photoGrid=ps=>`<div class="pgrid">${ps.map(p=>`<button class="ph" ${goAttr("photo",{kind:"photos",id:p.id})}>${p.stage?`<span class="tag">${esc(p.stage)}</span>`:""}<img src="${p.thumb}" alt="${esc(p.caption||"Photo")}" loading="lazy"><span>${esc(p.caption||fmtD(p.date))}</span></button>`).join("")}</div>`;
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i)};i.onerror=()=>rej(new Error("Can't read "+file.name+". Try a JPEG or PNG photo."));i.src=u})}
function shrink(img,max,q,maxLen){const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);let out=c.toDataURL("image/jpeg",q);while(maxLen&&out.length>maxLen&&q>.35){q-=.08;out=c.toDataURL("image/jpeg",q)}if(maxLen&&out.length>maxLen)return shrink(img,max*.8,.7,maxLen);return out}

/* ---------- CSV export of a mill's technical data ---------- */
function exportTech(millId){
  const q=c=>`"${String(c??"").replace(/"/g,'""')}"`;const rows=[["Type","Date","Mill","Department / sample","Machine","Count","Parameter","Unit","Actual","Target","Observation"]];
  ["process","quality"].forEach(k=>arr(k).filter(r=>r.millId===millId).sort((a,b)=>recDate(a).localeCompare(recDate(b))).forEach(r=>(r.params||[{name:"",unit:"",actual:"",target:""}]).forEach(p=>rows.push([KIND[k].many,r.date,millName(r.millId),r.dept||r.sampleType,machOf(r),r.count,p.name,p.unit,p.actual,p.target,r.observation]))));
  arr("production").filter(r=>r.millId===millId).forEach(r=>{[["Planned",r.planned],["Actual",r.actual],["Efficiency %",effOf(r)],["Downtime hrs",r.downtime],["Waste %",r.waste],["Power kWh",r.power]].forEach(([n,v])=>{if(v!=null&&v!=="")rows.push(["Production",r.date,millName(r.millId),r.dept,machOf(r),r.count,n,n.includes("%")||n.includes("hrs")||n.includes("kWh")?"":r.unit,v,"",r.reasons])})});
  saveFile(`technical_${(millName(millId)).replace(/[^A-Za-z0-9]+/g,"_")}_${todayISO()}.csv`,rows.map(r=>r.map(q).join(",")).join("\n"));
}

function dayEvents(iso){
  const ev=[];
  arr("visits").filter(v=>v.date===iso&&v.status!=="Cancelled").forEach(v=>ev.push({t:v.status==="Planned"?"planned":"done",millId:v.millId,label:v.purpose||v.type,go:["visit",{id:v.id}]}));
  followUps().filter(f=>f.date===iso).forEach(f=>ev.push({t:"follow",millId:f.millId,label:"Follow-up: "+f.text,go:[f.view,f.p]}));
  arr("plans").filter(p=>p.targetDate===iso&&p.status!=="Done"&&p.status!=="Dropped").forEach(p=>ev.push({t:"plan",millId:p.millId,label:"Plan: "+p.title,go:["plan",{id:p.id}]}));
  return ev;
}
function calendarHTML(){

  ${cells.map(c=>{if(!c)return `<div></div>`;const e=dayEvents(c);const done=e.filter(x=>x.t==="done"),pl=e.filter(x=>x.t==="planned"),oth=e.filter(x=>x.t!=="done"&&x.t!=="planned");

  <div class="legend"><span><i class="lg done"></i>Visited</span><span><i class="lg plan"></i>Planned visit</span><span><i class="lg follow"></i>Follow-up due</span><span><i class="lg pl"></i>Plan target</span></div>
  <div class="small muted">${monthVisits.length} visit${monthVisits.length===1?"":"s"} to ${millsVisited.size} mill${millsVisited.size===1?"":"s"} this month · ${planned} planned</div>
  ${calYM!==t.slice(0,7)?`<button class="btn" id="calToday">Back to this month</button>`:""}</div>
  <section class="panel" id="daylist"><div class="spread"><h2>${fmtD(calDay)}</h2><button class="linkbtn" ${goAttr("planForm",{date:calDay})}>+ Plan a visit this day</button></div>
  ${ev.length?`<div class="list">${ev.map(x=>`<button class="item" ${goAttr(x.go[0],x.go[1])}><div class="main"><div class="t">${esc(x.millId?millName(x.millId):"General")}</div><div class="s">${esc(x.label||"")}</div></div><div class="r"><span class="pill ${x.t==="done"?"good":x.t==="planned"?"acc":x.t==="follow"?"warn":""}">${x.t==="done"?"Visited":x.t==="planned"?"Planned":x.t==="follow"?"Follow-up":"Plan"}</span></div></button>`).join("")}</div>`:`<p class="muted small" style="margin:0">Nothing on this day.</p>`}</section>`;
}
function whereNextHTML(){
  const t=todayISO();
  const rows=arr("mills").filter(m=>m.status!=="Inactive").map(m=>{
    const lv=lastVisit(m.id),np=nextPlanned(m.id);const since=lv?daysBetween(lv.date,t):null;
    const every=parseInt(m.visitEvery)||0;const dueBy=lv&&every?addDays(lv.date,every):null;
    const fu=followUps().filter(f=>f.millId===m.id);const fuDue=fu.filter(f=>f.date<=addDays(t,7)).length;
    const openPlans=arr("plans").filter(p=>p.millId===m.id&&p.status!=="Done"&&p.status!=="Dropped").length;
    const overdueBy=dueBy?daysBetween(dueBy,t):null;
    // score: follow-ups due, overdue against own visit cycle, then days since last visit
    const score=(np?-1000:0)+fuDue*100+(overdueBy!=null?Math.max(0,overdueBy)*2:0)+(since??120);
    return{m,lv,np,since,every,dueBy,overdueBy,fuDue,openPlans,score};
  }).sort((a,b)=>b.score-a.score);
  if(!rows.length)return `<div class="empty">Add mills to see where to go next.</div>`;
  return `<p class="small muted" style="margin:0">Mills are ordered by follow-ups due, then how overdue each is against its visit cycle, then days since the last visit. Mills with a visit already planned go to the bottom.</p>
  <div class="list">${rows.map(r=>{const why=[r.fuDue?`${r.fuDue} follow-up${r.fuDue>1?"s":""} due`:"",r.overdueBy>0?`${r.overdueBy} days past ${r.every}-day cycle`:"",r.openPlans?`${r.openPlans} open plan${r.openPlans>1?"s":""}`:""].filter(Boolean).join(" · ");
    return `<div class="item" style="cursor:default;flex-wrap:wrap"><div class="main" style="min-width:180px"><button class="linkbtn t" ${goAttr("mill",{id:r.m.id})}>${esc(r.m.name)}</button><div class="s">${r.lv?`Last visit ${fmtD(r.lv.date)} · ${r.since} days ago`:"Not visited yet"}${r.m.city?" · "+esc(r.m.city):""}</div>${why?`<div class="s" style="color:var(--warn)">${esc(why)}</div>`:""}</div>
    <div class="r">${r.np?`<span class="pill acc">Planned ${fmtD(r.np.date)}</span>`:`<button class="btn pri" style="min-height:42px" ${goAttr("planForm",{millId:r.m.id})}>Plan visit</button>`}</div></div>`}).join("")}</div>
  <span class="small muted">Set "Visit every … days" in each mill's details to track how overdue a mill is.</span>`;
}

const LOGTYPES=["Call","WhatsApp","Meeting","Email","Visit"];
const digits=s=>String(s||"").replace(/[^\d+]/g,"");
function waNumber(s){let d=String(s||"").replace(/\D/g,"");d=d.replace(/^0+/,"");if(d.length===10)d="91"+d;return d.length>=11?d:""}
const fmtPhone=s=>{const d=String(s||"").replace(/\D/g,"");const t=d.length===12&&d.startsWith("91")?d.slice(2):d;return t.length===10?`${t.slice(0,5)} ${t.slice(5)}`:s};
const initials=n=>String(n||"?").replace(/\(.*?\)/g,"").trim().split(/[\s.]+/).filter(w=>w&&/[A-Za-z]/.test(w[0])).map(w=>w[0].toUpperCase()).slice(-2).join("")||"?";
const avHue=n=>{let h=0;for(const c of String(n))h=(h*31+c.charCodeAt(0))%360;return h};
const avatar=(c,size=44)=>`<span class="av" style="--h:${avHue(c.name)};width:${size}px;height:${size}px;font-size:${size*.38}px" aria-hidden="true">${esc(initials(c.name))}</span>`;

function birthdaysSoon(days=7){
  const t=todayISO();const out=[];
  arr("contacts").forEach(c=>{if(!c.birthday)return;const md=c.birthday.slice(5);for(let i=0;i<=days;i++){const d=addDays(t,i);if(d.slice(5)===md){out.push({c,d,i});break}}});
  return out.sort((a,b)=>a.i-b.i);
}

function lastContact(c){const t=[];if(c.lastTapped)t.push([c.lastTapped,`${c.lastTappedType||"Opened"} button, ${new Date(c.lastTapped).toLocaleDateString("en-IN",{day:"2-digit",month:"short"})}`]);(c.log||[]).forEach(l=>t.push([new Date(l.date+"T12:00:00").getTime(),`${l.type}, ${fmtD(l.date)}`]));t.sort((a,b)=>b[0]-a[0]);return t[0]?.[1]||""}
const vEsc=s=>String(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
function toVcf(list){return list.map(c=>["BEGIN:VCARD","VERSION:3.0",`FN:${vEsc(c.name)}`,`N:${vEsc(c.name)};;;;`,orgOf(c)?`ORG:${vEsc(orgOf(c))}`:"",c.role?`TITLE:${vEsc(c.role)}`:"",c.phone?`TEL;TYPE=CELL:${digits(c.phone)}`:"",c.altPhone?`TEL;TYPE=WORK:${digits(c.altPhone)}`:"",c.email?`EMAIL:${vEsc(c.email)}`:"",c.address?`ADR;TYPE=WORK:;;${vEsc(c.address)};;;;`:"",c.birthday?`BDAY:${c.birthday}`:"",c.notes?`NOTE:${vEsc(c.notes)}`:"","END:VCARD"].filter(Boolean).join("\r\n")).join("\r\n")}

/* import from phone contacts (.vcf) or pasted list */
function parseVcf(text){
  const out=[];text.replace(/\r\n[ \t]/g,"").split(/BEGIN:VCARD/i).slice(1).forEach(block=>{
    const c={};block.split(/\r?\n/).forEach(line=>{const i=line.indexOf(":");if(i<0)return;const key=line.slice(0,i).toUpperCase(),val=line.slice(i+1).replace(/\\n/g,"\n").replace(/\\([,;\\])/g,"$1").trim();
      if(key.startsWith("FN"))c.name=val;else if(key.startsWith("N")&&!c.name&&key.split(";")[0]==="N")c.name=val.split(";").reverse().filter(Boolean).join(" ");
      else if(key.startsWith("TEL")){if(!c.phone)c.phone=val;else if(!c.altPhone)c.altPhone=val}
      else if(key.startsWith("EMAIL")&&!c.email)c.email=val;else if(key.startsWith("ORG"))c.company=val.split(";")[0];else if(key.startsWith("TITLE"))c.role=val;else if(key.startsWith("NOTE"))c.notes=val;else if(key.startsWith("BDAY")&&/^\d{4}-?\d{2}-?\d{2}/.test(val))c.birthday=val.replace(/^(\d{4})-?(\d{2})-?(\d{2}).*/,"$1-$2-$3")});
    if(c.name)out.push(c)});
  return out;
}
function parseList(text){return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{const ph=(l.match(/(\+?\d[\d\s-]{8,}\d)/)||[])[1]||"";const rest=l.replace(ph,"").split(/[,\t|]+/).map(x=>x.trim()).filter(Boolean);return{name:rest[0]||"",role:rest[1]||"",phone:ph.replace(/[\s-]/g,"")}}).filter(c=>c.name)}

function loadLib(src,globalName){return new Promise((res,rej)=>{if(window[globalName])return res(window[globalName]);const sc=document.createElement("script");sc.src=src;sc.onload=()=>window[globalName]?res(window[globalName]):rej(new Error("Library didn't load"));sc.onerror=()=>rej(new Error("Couldn't load the export tool. Check your internet connection."));document.head.appendChild(sc)})}
const safeName=s=>String(s||"").replace(/^Sample\s+—\s+/,"Sample ").replace(/[^A-Za-z0-9 _.-]+/g," ").replace(/\s+/g,"_").slice(0,60)||"file";
function buildSheets(){
  const mn=id=>id?millName(id):"General";const rs=v=>v?(v/100):"";
  const sheets={};
  sheets["Mills"]=arr("mills").sort((a,b)=>a.name.localeCompare(b.name)).map(m=>({"Mill":m.name,"Group":m.group,"Status":m.status,"Address":m.address,"City":m.city,"State":m.state,"PIN":m.pin,"GSTIN":m.gstin,"Contact":m.contactName,"Designation":m.contactRole,"Phone":m.contactPhone,"Email":m.contactEmail,"Accounts email":m.accountsEmail,"Owner / MD":m.md,"Fee per day (₹)":rs(m.fee),"Payment terms (days)":m.payTermsDays,"Visit every (days)":m.visitEvery,"Spindles":m.spindles,"Counts":m.counts,"Machinery":m.machinery,"Remarks":m.notes}));
  sheets["Contacts"]=arr("contacts").sort((a,b)=>millName(a.millId).localeCompare(millName(b.millId))).map(c=>({"Mill":mn(c.millId),"Name":c.name,"Role":c.role,"Department":c.dept,"Mobile":c.phone,"WhatsApp":c.whatsapp||c.phone,"Email":c.email,"Notes":c.notes}));
  sheets["Visits"]=arr("visits").sort((a,b)=>a.date.localeCompare(b.date)).map(v=>({"Date":v.date,"Mill":mn(v.millId),"Status":v.status,"Type":v.type,"Start":v.start,"End":v.end,"Purpose":v.purpose,"Department":v.dept,"Persons met":v.persons,"Observations":v.observations,"Recommendations":v.recommendations,"Follow-up":v.followUp,"Follow-up date":v.followDate,"Fee per day (₹)":rs(v.fee),"Days":v.days,"Travel (₹)":rs(v.travel),"Other exp (₹)":rs(v.otherExp),"Bill no.":visitBill(v)?.no||"","Notes":v.notes}));
  const paramRows=k=>{const out=[];arr(k).sort((a,b)=>recDate(a).localeCompare(recDate(b))).forEach(r=>{const base={"Date":r.date,"Mill":mn(r.millId),[k==="process"?"Department":"Sample type"]:r.dept||r.sampleType,"Machine":machOf(r),"Count / product":r.count,[k==="process"?"Fibre / blend":"Lot"]:(k==="process"?r.fibre:r.lot)};const ps=r.params?.length?r.params:[{}];ps.forEach(p=>out.push({...base,"Parameter":p.name||"","Unit":p.unit||"","Actual":numv(p.actual)??p.actual??"","Target":numv(p.target)??p.target??"","Observation":r.observation,[k==="process"?"Recommendation":"Corrective action"]:r.recommendation||r.action}))});return out};
  sheets["Process parameters"]=paramRows("process");
  sheets["Quality"]=paramRows("quality");
  sheets["Production"]=arr("production").sort((a,b)=>recDate(a).localeCompare(recDate(b))).map(r=>({"Date":r.date,"Mill":mn(r.millId),"Department":r.dept,"Period":r.period,"Shift":r.shift,"Machine":machOf(r),"Count":r.count,"Planned":numv(r.planned)??"","Actual":numv(r.actual)??"","Unit":r.unit,"Efficiency %":effOf(r)??"","Running hrs":numv(r.hours)??"","Downtime hrs":numv(r.downtime)??"","Waste %":numv(r.waste)??"","Utilisation %":numv(r.utilisation)??"","Power kWh":numv(r.power)??"","Source":r.source,"Reasons":r.reasons,"Corrective measures":r.action}));
  sheets["Machines"]=arr("machines").map(m=>({"Mill":mn(m.millId),"Machine no.":m.no,"Type":m.type,"Make":m.make,"Model":m.model,"Department":m.dept,"Year":m.year,"Capacity":m.capacity,"Serial":m.serial,"Status":m.status,"Recommended settings":m.settings,"Repeated breakdowns":m.issues,"Maintenance notes":m.maintenance,"Spares":m.spares,"Remarks":m.remarks}));
  sheets["Best practices"]=arr("practices").map(p=>({"Date":p.date,"Title":p.title,"Category":p.category,"Mill":mn(p.millId),"Department":p.dept,"Machine type":p.machineType,"Visibility":p.visibility,"Problem":p.problem,"Earlier practice":p.existing,"Best practice":p.practice,"Why it works":p.why,"Steps":p.steps,"Settings":p.settings,"Expected benefit":p.expected,"Measured benefit":p.verified,"Risks":p.risks,"Tags":p.tags}));
  sheets["Plans"]=arr("plans").map(p=>({"Mill":mn(p.millId),"Plan":p.title,"Status":p.status,"Priority":p.priority,"Target date":p.targetDate,"Details":p.details}));
  sheets["Notes"]=arr("notes").sort((a,b)=>recDate(a).localeCompare(recDate(b))).map(n=>({"Date":n.date,"Mill":mn(n.millId),"Title":n.title,"Note":n.text}));
  sheets["Bills"]=arr("invoices").filter(i=>i.status!=="Draft").sort((a,b)=>a.date.localeCompare(b.date)).map(i=>{const{cash,tds,balance}=invPaid(i);return{"Bill no.":i.no,"Date":i.date,"Mill":mn(i.millId),"Period":i.period,"Taxable (₹)":rs(i.taxable),"CGST":rs(i.cgst),"SGST":rs(i.sgst),"IGST":rs(i.igst),"Total (₹)":rs(i.total),"Received (₹)":rs(cash),"TDS (₹)":rs(tds),"Balance (₹)":i.status==="Cancelled"?0:rs(balance),"Status":invStatus(i).l}});
  sheets["Payments"]=arr("payments").sort((a,b)=>a.date.localeCompare(b.date)).map(p=>({"Date received":p.date,"Mill":mn(p.millId),"Bill no.":S.invoices[p.invoiceId]?.no||"","Amount (₹)":rs(p.amount),"TDS (₹)":rs(p.tds),"Received into":p.account||"","Mode":p.mode,"Reference":p.ref,"Notes":p.notes}));
  sheets["Photos index"]=arr("photos").sort((a,b)=>recDate(a).localeCompare(recDate(b))).map(p=>({"Date":p.date,"Mill":mn(p.millId),"Caption":p.caption,"Department":p.dept,"Machine":machOf(p),"Before/after":p.stage,"File":photoPath(p)}));
  return sheets;
}
const photoPath=p=>`Photos/${safeName(millName(p.millId))}/${p.date||"undated"}_${safeName(p.caption||"photo")}_${p.id.slice(-5)}.jpg`;
async function makeWorkbook(){
  const XLSX=await loadLib("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","XLSX");
  const wb=XLSX.utils.book_new();const sh=buildSheets();
  Object.entries(sh).forEach(([name,rows])=>{const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{"(no records yet)":""}]);const keys=Object.keys(rows[0]||{"x":1});ws["!cols"]=keys.map(k=>({wch:Math.min(48,Math.max(k.length+2,...rows.slice(0,200).map(r=>String(r[k]??"").length+1)))}));XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))});
  return XLSX.write(wb,{bookType:"xlsx",type:"array"});
}
async function exportExcel(btn){
  const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent="Preparing…"}
  try{const data=await makeWorkbook();const ok=await saveFile(`RRS_TexConPro_Data_${todayISO()}.xlsx`,new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));if(ok)await markBackup()}
  catch(e){toast(e.message||"Export failed")}finally{if(btn){btn.disabled=false;btn.textContent=old}}
}
async function exportZip(btn){
  const old=btn?.textContent;btn.disabled=true;
  try{
    btn.textContent="Loading tools…";const JSZip=await loadLib("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js","JSZip");
    const root=`RRS_TexConPro_Backup_${todayISO()}`;const zip=new JSZip();const dir=zip.folder(root);
    btn.textContent="Building spreadsheet…";dir.file("RRS_TexConPro_Data.xlsx",await makeWorkbook());
    const {photoData,...rest}=S;dir.file("restore_file_do_not_edit.json",JSON.stringify({app:"texconsult",v:2,at:new Date().toISOString(),...rest}));
    dir.file("README.txt",`RRS TEXCONPRO backup made ${fmtD(todayISO())}.\n\nRRS_TexConPro_Data.xlsx — all records, one sheet per section (Mills, Visits, Process parameters, Quality, Production, Machines, Best practices, Plans, Notes, Bills, Payments, Photos index).\nPhotos/ — one folder per mill. File names start with the date.\nrestore_file_do_not_edit.json — use Settings > Restore from backup to bring records back into the app.\n`);
    const ps=arr("photos");let i=0,miss=0;
    for(const p of ps){i++;btn.textContent=`Adding photos ${i} of ${ps.length}…`;try{const d=await getPhotoData(p.id)||p.thumb;dir.file(photoPath(p),d.split(",")[1],{base64:true})}catch(e){miss++}}
    btn.textContent="Compressing…";const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
    const ok=await saveFile(`${root}.zip`,blob);if(ok){await markBackup();if(miss)toast(`${miss} photo${miss>1?"s":""} couldn't be added; the rest are saved`)}
  }catch(e){toast(e.message||"Backup failed")}finally{btn.disabled=false;btn.textContent=old}
}
