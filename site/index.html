/* ---------- professional consultancy bill (A4) ---------- */
function billModel(inv){
  const isFee=l=>l.kind==="fee"||/^Technical consultancy/.test(l.desc||"");
  const fee=inv.lines.filter(isFee),extra=inv.lines.filter(l=>!isFee(l));
  const rows=[];
  if(fee.length){
    const rates=[...new Set(fee.map(l=>l.rate))];const days=fee.reduce((a,l)=>a+(+l.qty||0),0);
    const dates=fee.map(l=>{const m=(l.desc||"").match(/\((\d{2}-\w{3}-\d{4})\)/)||[];return (l.date?fmtD(l.date):m[1]||"")+(+l.qty>1?` (${l.qty} days)`:"")}).filter(Boolean);
    const purposes=[...new Set(fee.map(l=>l.purpose||((l.desc||"").match(/— (.*) \(/)||[])[1]).filter(Boolean))];
    const sub=[dates.length?`Visit${dates.length>1?"s":""}: ${dates.join(", ")}`:"",rates.length===1&&rates[0]?`${days} day${days===1?"":"s"} × Rs. ${inr(rates[0])} per day`:"",purposes.length?`Scope: ${purposes.join("; ")}`:""].filter(Boolean).join("\n");
    rows.push({title:"Technical Consultancy Fees",sub,amount:fee.reduce((a,l)=>a+l.amount,0)});
  }
  extra.forEach(l=>rows.push({title:l.desc||"Consultancy Fees",sub:"",amount:l.amount}));
  if(inv.travel)rows.push({title:"Travelling Expenses",sub:"",amount:inv.travel});
  if(inv.otherExp)rows.push({title:"Accommodation & Other Expenses",sub:"",amount:inv.otherExp});
  const sum=[];const gross=rows.reduce((a,r)=>a+r.amount,0);
  if(inv.discount||inv.cgst||inv.sgst||inv.igst)sum.push(["Sub-total",gross]);
  if(inv.discount)sum.push(["Less: Discount",-inv.discount]);
  if(inv.cgst)sum.push([`CGST @ ${inv.rateBp/200}%`,inv.cgst],[`SGST @ ${inv.rateBp/200}%`,inv.sgst]);
  if(inv.igst)sum.push([`IGST @ ${inv.rateBp/100}%`,inv.igst]);
  const{cash,tds,balance,ps}=invPaid(inv);
  const paid=inv.status==="Issued"&&balance<=0&&(cash+tds)>0;
  const modes=[...new Set(ps.map(p=>p.mode).filter(Boolean))].join(" / ");const lastPay=ps.map(p=>p.date).sort().pop();
  return{rows,sum,total:inv.total,paid,cash,tds,balance,modes,lastPay,title:inv.taxMode&&inv.taxMode!=="none"?"TAX INVOICE":"CONSULTANCY BILL"};
}

async function buildPdf(inv){
  if(!window.jspdf)throw new Error("PDF tool didn't load. Check your connection and reopen the page.");

  const T=(t,x,y,o)=>doc.text(String(t??""),x,y,o);const font=(st,sz,c=ink)=>{doc.setFont("helvetica",st);doc.setFontSize(sz);doc.setTextColor(...c)};

    font("normal",10,ink);T(String(i+1),(L+c1)/2,y,{align:"center"});font("bold",10,ink);T(r.title,c1+3,y);font("normal",10,ink);T(inr(r.amount),R-3,y,{align:"right"});

function wireSend(inv){

/* ---------- reports ---------- */
let rPeriod="This FY",rFrom="",rTo="",rMill="",rParam="",rSample="Yarn";
const PERIODS=["This month","Last month","Last 3 months","This FY","Last FY","Last 12 months","All time","Custom"];
function range(){
  const t=todayISO(),[y,m]=t.split("-").map(Number);const ym=(Y,M)=>{const d=new Date(Y,M-1,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`};
  const fyStart=(m>=4?y:y-1);
  switch(rPeriod){
    case "This month":return[t.slice(0,8)+"01",t];
    case "Last month":{const p=ym(y,m-1);return[p+"-01",addDays(t.slice(0,8)+"01",-1)]}
    case "Last 3 months":return[ym(y,m-2)+"-01",t];
    case "This FY":return[`${fyStart}-04-01`,`${fyStart+1}-03-31`];

/* ---------- website-only: downloads, phone share sheet, printing ---------- */
async function saveFile(name,data){
  try{const blob=data instanceof Blob?data:new Blob([data],{type:/\.json$/.test(name)?"application/json":/\.csv$/.test(name)?"text/csv":/\.vcf$/.test(name)?"text/vcard":"application/octet-stream"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast("Saved "+name);return true}
  catch(e){toast("Couldn't save the file: "+(e.message||""));return false}
}
const canShareFiles=()=>{try{return !!(navigator.canShare&&navigator.canShare({files:[new File(["x"],"x.pdf",{type:"application/pdf"})]}))}catch(e){return false}};
async function sharePdf(inv,text){
  const doc=await buildPdf(inv);const file=new File([doc.output("blob")],pdfName(inv),{type:"application/pdf"});
  if(canShareFiles()){try{await navigator.share({files:[file],title:`Bill ${inv.no}`,text});return "shared"}catch(e){if(e.name==="AbortError")return "cancelled";throw e}}
  await saveFile(file.name,file);return "saved";
}
function printBill(inv){
  const css=[...document.querySelectorAll("style")].map(s=>s.textContent).join("\n");
  const fr=document.createElement("iframe");fr.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0";document.body.appendChild(fr);
  const d=fr.contentDocument;d.open();d.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(inv.no||"Bill")}</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap"><style>${css}
    @page{size:A4;margin:12mm}html,body{background:#fff!important;margin:0;padding:0}.bwrap{overflow:visible}.bill{border:0;min-width:0;font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body>${invoicePaper(inv,{showSig:inv.status!=="Draft"})}</body></html>`);d.close();
  const go=()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){toast("Printing isn't available here. Download the PDF and print it.")}setTimeout(()=>fr.remove(),60000)};
  (fr.contentDocument.fonts?.ready||Promise.resolve()).then(()=>setTimeout(go,250));
}
function sendPanel(inv){
  const m=S.mills[inv.millId]||{};const to=m.accountsEmail||m.contactEmail||"";const cc=m.accountsEmail&&m.contactEmail&&m.contactEmail!==m.accountsEmail?m.contactEmail:"";
  const subject=`Consultancy Bill ${inv.no} – ${m.name||""}${inv.period?" – "+inv.period:""}`;const msg=billMessage(inv);
  const mailto=`mailto:${encodeURIComponent(to)}?${cc?"cc="+encodeURIComponent(cc)+"&":""}subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(msg)}`;
  const rec=billRecipients(inv);const share=canShareFiles();
  return `<section class="panel"><h2>Send & print</h2>
  <div class="sendgrid">
    <button class="sbtn" id="sWa"><span class="sic wa">WA</span>WhatsApp${share?" with PDF":""}</button>
    <button class="sbtn" id="sMail"><span class="sic">@</span>Email${share?" with PDF":""}</button>
    <button class="sbtn" id="sPrint"><span class="sic">⎙</span>Print</button>
    <button class="sbtn" id="sPdf"><span class="sic">PDF</span>Download PDF</button>
  </div>
  <div id="sWaPick" hidden><div class="small muted">Open a chat with the bill message${share?" (then attach the PDF from Downloads, or use the PDF button above)":""}:</div>${rec.length?`<div class="list">${rec.map(c=>`<a class="item" href="https://wa.me/${waNumber(c.whatsapp||c.phone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" data-walog="${esc(c.name)}">${avatar(c,36)}<span class="main"><span class="t">${esc(c.name)}</span><span class="s">${esc(c.role||"")} · ${esc(fmtPhone(c.whatsapp||c.phone))}</span></span><span class="pill good">Open chat</span></a>`).join("")}</div>`:`<p class="small" style="margin:0">No WhatsApp number saved for ${esc(m.name||"this mill")}.</p>`}</div>
  <p class="small muted" style="margin:0">${share?`<b>WhatsApp with PDF</b> and <b>Email with PDF</b> open your phone's share screen with the bill attached; pick WhatsApp or Gmail, then the person.`:`On this device the PDF can't be attached automatically: download it, then attach it in WhatsApp or email.`} ${to?`The mill's email is <b>${esc(to)}</b>${cc?` (copy to ${esc(cc)})`:""}.`:`No email saved for this mill. <button class="linkbtn" ${goAttr("millForm",{id:inv.millId})}>Add accounts email</button>`}</p>
  <div class="row"><button class="linkbtn small" id="sWaText">WhatsApp a saved contact (message only)</button><a class="linkbtn small" href="${esc(mailto)}" id="sMailTo">Email with address filled in (attach PDF yourself)</a><button class="linkbtn small" id="sCopyTo">Copy mill email</button></div></section>`;
}
function wireSend(inv){
  const m=S.mills[inv.millId]||{};const to=m.accountsEmail||m.contactEmail||"";
  const log=what=>{dirty=false;put("invoices",{...S.invoices[inv.id],emailLog:[...(S.invoices[inv.id].emailLog||[]),{what,at:Date.now()}]})};
  const viaShare=async(label)=>{try{const r=await sharePdf(inv,billMessage(inv));if(r==="shared")log(`Bill PDF shared (${label})`);else if(r==="saved")log("PDF downloaded")}catch(e){toast(e.message||"Couldn't share")}};
  $("#sPdf").onclick=async()=>{if(await makePdf(inv))log("PDF downloaded")};
  $("#sPrint").onclick=()=>{printBill(inv);log("Print opened")};
  $("#sWa").onclick=()=>{if(canShareFiles())viaShare("WhatsApp");else{const p=$("#sWaPick");p.hidden=!p.hidden}};
  $("#sMail").onclick=async()=>{if(canShareFiles()){if(to)try{await navigator.clipboard.writeText(to);toast("Mill email copied. Paste it in the To field.")}catch(e){}viaShare("email")}else{location.href=$("#sMailTo").href;log("Email app opened")}};
  $("#sWaText").onclick=()=>{const p=$("#sWaPick");p.hidden=!p.hidden};
  $("#sCopyTo").onclick=()=>to?copy(to):toast("No email saved for this mill");
  document.querySelectorAll("[data-walog]").forEach(a=>a.addEventListener("click",()=>log("WhatsApp opened for "+a.dataset.walog)));
  $("#sMailTo").addEventListener("click",()=>log("Email app opened"));
}

boot();
